name: Release Cho's Testing to Google Play

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: New Play version code (must never be reused)
        required: true
        type: string
      version_name:
        description: Testing version name, for example 0.1.1-testing
        required: true
        type: string
      release_notes:
        description: Client-facing summary of this testing update
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-cho-testing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: google-play-testing
    env:
      PACKAGE_NAME: com.xatoridev.chosmartialarts.testing
      PLAY_TRACK: internal
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - name: Validate private destination
        run: node scripts/validate-play-release-input.mjs testing "$PACKAGE_NAME" "$PLAY_TRACK" "$ANDROID_VERSION_CODE" "$ANDROID_VERSION_NAME" "$RELEASE_NOTES"
      - run: npm run test
      - name: Restore Android upload key
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-key.jks
          printf 'storeFile=upload-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$ANDROID_UPLOAD_STORE_PASSWORD" "$ANDROID_UPLOAD_KEY_ALIAS" "$ANDROID_UPLOAD_KEY_PASSWORD" > android/key.properties
      - run: npm run build:android:testing
      - run: npm run verify:demo-artifact
      - name: Save release notes
        shell: bash
        run: |
          mkdir -p play-whats-new
          printf '%s\n' "$RELEASE_NOTES" > play-whats-new/whatsnew-en-US
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: chos-testing-${{ inputs.version_code }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/demoRelease/app-demo-release.aab
          if-no-files-found: error
      - name: Upload to private Play closed testing
        if: vars.PLAY_UPLOAD_ENABLED == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/demoRelease/app-demo-release.aab
          tracks: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: play-whats-new
