name: Verify main web release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-release-validation
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser end-to-end tests
        run: npm run test:e2e

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify staging build environment
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_DEVELOPER_ACCOUNT: ${{ vars.VITE_ENABLE_DEVELOPER_ACCOUNT }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL is required for hosted pilot builds."
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY is required for hosted pilot builds."
            exit 1
          fi
          if [ "$VITE_ENABLE_DEVELOPER_ACCOUNT" != "true" ]; then
            echo "VITE_ENABLE_DEVELOPER_ACCOUNT must be true for the selected public staging pilot."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            *zfuwbbepsnmmlpgfkmhz.supabase.co*) ;;
            *)
              echo "VITE_SUPABASE_URL must point to Cho's staging Supabase project."
              exit 1
              ;;
          esac

      - name: Build Cloudflare Pages artifact
        env:
          CLOUDFLARE_PAGES: "true"
          VITE_APP_VARIANT: "stable"
          VITE_APPROVED_SUPABASE_HOST: "zfuwbbepsnmmlpgfkmhz.supabase.co"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ENABLE_DEVELOPER_ACCOUNT: ${{ vars.VITE_ENABLE_DEVELOPER_ACCOUNT }}
        run: npm run build:cloudflare

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: ./dist
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: chos-martial-arts-operations-app
      PRODUCTION_URL: https://chos-martial-arts-operations-app.pages.dev
    steps:
      - name: Require Cloudflare deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-pages-dist
          path: dist

      - name: Deploy verified artifact to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name ${{ env.PROJECT_NAME }} --branch main --commit-hash ${{ github.sha }}

      - name: Verify deployed commit
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Wrangler did not return an immutable deployment URL."
            exit 1
          fi

          verify_version() {
            local base_url="$1"
            local label="$2"
            local response=""
            local actual=""
            for attempt in {1..12}; do
              response="$(curl --fail --silent --show-error "${base_url%/}/app-version.json?sha=$EXPECTED_SHA" || true)"
              actual="$(node -e 'try { process.stdout.write(JSON.parse(process.argv[1]).version || "") } catch {}' "$response")"
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                echo "$label reports expected commit $EXPECTED_SHA at $base_url"
                return 0
              fi
              sleep 5
            done
            echo "$label version mismatch: expected $EXPECTED_SHA, received ${actual:-<unavailable>}"
            exit 1
          }

          verify_version "$DEPLOYMENT_URL" "Immutable deployment"
          verify_version "$PRODUCTION_URL" "Permanent Pages URL"
